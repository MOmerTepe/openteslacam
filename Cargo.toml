[package]
name = "openteslacam"
version.workspace = true
license.workspace = true
edition = "2024"

[workspace]
members = ["installer"]

# One version for the app and its installer. scripts/build-installer.ps1 reads it too.
[workspace.package]
version = "2.0.0"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
openh264 = "0.9.9"
rfd = "0.17.2"
serde_json = "1.0.154"
walkers = "0.65.0"

# openh264 is unusably slow unoptimized; keep deps fast in dev builds.
[profile.dev.package."*"]
opt-level = 3
